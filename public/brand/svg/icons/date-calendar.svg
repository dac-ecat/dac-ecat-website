  <line x1="4" y1="11" x2="24" y2="11" stroke="#00e5c8" stroke-width="0.8"/>
  <line x1="8"  y1="6"  x2="8"  y2="4"  stroke="#00e5c8" stroke-width="1.2" stroke-linecap="round"/>
