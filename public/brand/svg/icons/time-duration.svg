<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <rect x="1" y="1" rx="3" fill="#091828" stroke="#00e5c8" stroke-width="1.2"/>
  <!-- Clock face -->
  <circle cx="14" cy="15" r="10" fill="none" stroke="#00e5c8" stroke-width="1"/>
  <circle cx="14" cy="15" r="1.5" fill="#00e5c8" opacity="0.8"/>
  <!-- clock hands -->
  <line x1="14" y1="15" x2="14" y2="8"  stroke="#00e5c8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="15" x2="19" y2="18" stroke="#00e5c8" stroke-width="1" stroke-linecap="round"/>
  <!-- tick at 12 -->
  <line x1="14" y1="5.5" x2="14" y2="7" stroke="#00e5c8" stroke-width="1" opacity="0.5"/>
  <rect x="1" y="1" fill="#00e5c8" opacity="0.4" rx="1"/>
</svg>
