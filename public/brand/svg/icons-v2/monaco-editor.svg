<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" rx="3" fill="#0a1520" stroke="#3b9eff" stroke-width="1.2"/>
  <!-- line numbers column -->
  <rect x="1" y="1" rx="3" fill="#091018" stroke="none"/>
  <line x1="8" y1="1" x2="8" y2="35" stroke="#1a2535" stroke-width="0.8"/>
  <!-- line number dots -->
  <rect x="3" y="8"  rx="0.4" fill="#2a3f55"/>
  <rect x="3" y="12" rx="0.4" fill="#2a3f55"/>
  <rect x="3" y="16" rx="0.4" fill="#2a3f55"/>
  <rect x="3" y="20" rx="0.4" fill="#2a3f55"/>
  <rect x="3" y="24" rx="0.4" fill="#2a3f55"/>
  <!-- current line highlight -->
  <rect x="8" y="14" rx="0.5" fill="#3b9eff" opacity="0.08"/>
  <rect x="3" y="15" rx="0.4" fill="#3b9eff" opacity="0.6"/>
  <!-- code lines -->
  <rect x="10" y="8"   rx="0.5" fill="#a06af7" opacity="0.7"/>
  <rect x="17" y="8"  rx="0.5" fill="#3b9eff" opacity="0.6"/>
  <rect x="10" y="12"  rx="0.5" fill="#3ddc84" opacity="0.7"/>
  <rect x="15" y="12"  rx="0.5" fill="#f5e642" opacity="0.5"/>
  <rect x="10" y="15.5" rx="0.5" fill="#3b9eff" opacity="0.8"/>
  <rect x="10" y="20"  rx="0.5" fill="#a06af7" opacity="0.6"/>
  <rect x="18" y="20"  rx="0.5" fill="#3ddc84" opacity="0.5"/>
  <rect x="10" y="24"  rx="0.5" fill="#ff7a35" opacity="0.6"/>
  <!-- cursor blink line -->
  <rect x="22" y="15.5" rx="0.2" fill="#3b9eff"/>
</svg>
