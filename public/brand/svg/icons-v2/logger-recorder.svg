<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" rx="3" fill="#0a1520" stroke="#ff4d6a" stroke-width="1.2"/>
  <!-- REC indicator -->
  <circle cx="10" cy="9" r="4" fill="#ff4d6a" opacity="0.85"/>
  <text x="18" y="12" font-family="DM Mono,monospace" font-size="5" fill="#ff4d6a" font-weight="bold">REC</text>
  <!-- waveform being recorded -->
  <polyline points="4,22 7,18 10,24 13,16 16,22 19,19 22,25 25,17 28,22 32,20" fill="none" stroke="#ff4d6a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- scan line -->
  <line x1="28" y1="14" x2="28" y2="30" stroke="#ff4d6a" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
  <!-- time ticks -->
  <line x1="4"  y1="29" x2="4"  y2="31" stroke="#1a2535" stroke-width="0.8"/>
  <line x1="12" y1="29" x2="12" y2="31" stroke="#1a2535" stroke-width="0.8"/>
  <line x1="20" y1="29" x2="20" y2="31" stroke="#1a2535" stroke-width="0.8"/>
  <line x1="28" y1="29" x2="28" y2="31" stroke="#1a2535" stroke-width="0.8"/>
</svg>
