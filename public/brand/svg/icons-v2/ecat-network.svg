<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" rx="3" fill="#0a1520" stroke="#00e5c8" stroke-width="1.2"/>
  <!-- ECAT ring topology diagram -->
  <circle cx="18" cy="18" r="11" fill="none" stroke="#00e5c8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>
  <!-- Master node -->
  <rect x="14" y="4" rx="1" fill="#091828" stroke="#00e5c8" stroke-width="0.9"/>
  <text x="18" y="8.5" text-anchor="middle" font-family="DM Mono,monospace" font-size="3" fill="#00e5c8">MST</text>
  <!-- Slave nodes on ring -->
  <rect x="25" y="14" rx="1" fill="#091828" stroke="#3b9eff" stroke-width="0.8"/>
  <text x="28.5" y="17.5" text-anchor="middle" font-family="DM Mono,monospace" font-size="3" fill="#3b9eff">S1</text>
  <rect x="25" y="22" rx="1" fill="#091828" stroke="#3b9eff" stroke-width="0.8"/>
  <text x="28.5" y="25.5" text-anchor="middle" font-family="DM Mono,monospace" font-size="3" fill="#3b9eff">S2</text>
  <rect x="14" y="28" rx="1" fill="#091828" stroke="#ffaa00" stroke-width="0.8"/>
  <text x="18" y="31.5" text-anchor="middle" font-family="DM Mono,monospace" font-size="3" fill="#ffaa00">S3</text>
  <rect x="4"  y="22" rx="1" fill="#091828" stroke="#3b9eff" stroke-width="0.8"/>
  <text x="7.5" y="25.5" text-anchor="middle" font-family="DM Mono,monospace" font-size="3" fill="#3b9eff">S4</text>
  <!-- connections -->
  <line x1="18" y1="10" x2="25" y2="14" stroke="#00e5c8" stroke-width="0.8" opacity="0.6"/>
  <line x1="29" y1="19" x2="29" y2="22" stroke="#00e5c8" stroke-width="0.8" opacity="0.6"/>
  <line x1="25" y1="27" x2="22" y2="28" stroke="#00e5c8" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="30" x2="11" y2="27" stroke="#00e5c8" stroke-width="0.8" opacity="0.6"/>
  <line x1="7"  y1="22" x2="14" y2="10" stroke="#00e5c8" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
</svg>
