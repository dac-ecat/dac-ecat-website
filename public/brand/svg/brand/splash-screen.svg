<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"
     style="display:block; border:1px solid #1a2535;">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0d1a28"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e5c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffaa00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow4" x="-50%" y="-50%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow8" x="-100%" y="-100%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00e5c8"/>
      <stop offset="50%"  stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#00e5c8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5c8"/>
      <stop offset="60%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <clipPath id="catClip">
      <circle cx="400" cy="220" r="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect fill="url(#splashBg)"/>

  <!-- Grid lines -->
  <g stroke="#0d2030" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Ambient glows -->
  <ellipse cx="400" cy="220" rx="200" ry="180" fill="url(#glowTeal)"/>
  <ellipse cx="400" cy="350" rx="250" ry="80"  fill="url(#glowAmber)"/>

  <!-- ── EtherCAT ring segments (outer decoration) ── -->
  <!-- Large outer ring arc segments -->
  <g filter="url(#glow2)" opacity="0.5">
    <path d="M 240 80 A 180 180 0 0 1 560 80" fill="none" stroke="#00e5c8" stroke-width="1" stroke-dasharray="8,6"/>
    <path d="M 220 100 A 200 200 0 0 0 580 100" fill="none" stroke="#0088ff" stroke-width="0.5" stroke-dasharray="4,10"/>
  </g>

  <!-- Network topology lines radiating outward -->
  <g stroke="#00e5c8" stroke-width="0.75" opacity="0.3">
    <line x1="400" y1="105" x2="310" y2="48"/>
    <line x1="400" y1="105" x2="490" y2="48"/>
    <line x1="310" y1="48" x2="250" y2="30"/>
    <line x1="490" y1="48" x2="550" y2="30"/>
    <line x1="285" y1="220" x2="220" y2="180"/>
    <line x1="515" y1="220" x2="580" y2="180"/>
    <line x1="220" y1="180" x2="170" y2="150"/>
    <line x1="580" y1="180" x2="630" y2="150"/>
  </g>

  <!-- Network nodes -->
  <g filter="url(#glow4)">
    <circle cx="310" cy="48"  r="4" fill="#00e5c8"/>
    <circle cx="490" cy="48"  r="4" fill="#00e5c8"/>
    <circle cx="250" cy="30"  r="3" fill="#0088ff"/>
    <circle cx="550" cy="30"  r="3" fill="#0088ff"/>
    <circle cx="220" cy="180" r="3" fill="#00e5c8"/>
    <circle cx="580" cy="180" r="3" fill="#00e5c8"/>
    <circle cx="170" cy="150" r="2.5" fill="#ffaa00" opacity="0.7"/>
    <circle cx="630" cy="150" r="2.5" fill="#ffaa00" opacity="0.7"/>
  </g>

  <!-- ══════════════════════════════
       MAIN CAT LOGO — center
  ══════════════════════════════ -->
  <g transform="translate(400,220)">

    <!-- Outer glow ring -->
    <circle r="118" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4"
            stroke-dasharray="6,3" filter="url(#glow2)"/>
    <circle r="124" fill="none" stroke="#00e5c8" stroke-width="0.5" opacity="0.15"/>

    <!-- Face base -->
    <ellipse rx="95" ry="90" fill="#0a141e" stroke="#162030" stroke-width="1"/>

    <!-- ── EtherCAT ring topology inside face (ring network symbol) ── -->
    <g opacity="0.18" stroke="#00e5c8" stroke-width="1" fill="none">
      <circle r="60" stroke-dasharray="3,4"/>
      <circle r="72" stroke-dasharray="2,6"/>
    </g>

    <!-- ── LEFT EAR — hexagonal EtherCAT node ── -->
    <g transform="translate(-52,-78)">
      <!-- Ear triangle base -->
      <polygon points="0,-38 -28,8 28,8" fill="#0a141e" stroke="#00e5c8" stroke-width="1.5"/>
      <!-- Inner ear fill -->
      <polygon points="0,-26 -17,4 17,4" fill="#00e5c8" opacity="0.12"/>
      <!-- Node dot at tip -->
      <circle cy="-38" r="4" fill="#00e5c8" filter="url(#glow4)"/>
      <!-- Ring segment on ear -->
      <path d="M -14,-18 A 22 22 0 0 1 14,-18" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
      <!-- EtherCAT tick marks -->
      <line x1="-10" y1="-8" x2="-14" y2="-14" stroke="#00e5c8" stroke-width="0.75" opacity="0.6"/>
      <line x1="10"  y1="-8" x2="14"  y2="-14" stroke="#00e5c8" stroke-width="0.75" opacity="0.6"/>
    </g>

    <!-- ── RIGHT EAR — hexagonal EtherCAT node ── -->
    <g transform="translate(52,-78)">
      <polygon points="0,-38 -28,8 28,8" fill="#0a141e" stroke="#00e5c8" stroke-width="1.5"/>
      <polygon points="0,-26 -17,4 17,4" fill="#00e5c8" opacity="0.12"/>
      <circle cy="-38" r="4" fill="#00e5c8" filter="url(#glow4)"/>
      <path d="M -14,-18 A 22 22 0 0 1 14,-18" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
      <line x1="-10" y1="-8" x2="-14" y2="-14" stroke="#00e5c8" stroke-width="0.75" opacity="0.6"/>
      <line x1="10"  y1="-8" x2="14"  y2="-14" stroke="#00e5c8" stroke-width="0.75" opacity="0.6"/>
    </g>

    <!-- ── LEFT EYE — EtherCAT ring node ── -->
    <g transform="translate(-32,-12)">
      <!-- Eye socket -->
      <circle r="20" fill="#060e18" stroke="#00e5c8" stroke-width="1.5"/>
      <!-- Ring inside eye — the EtherCAT ring topology symbol -->
      <circle r="13" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
      <!-- Iris -->
      <ellipse rx="9" ry="11" fill="#001a2e"/>
      <!-- Iris ring -->
      <ellipse rx="9" ry="11" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.6"/>
      <!-- Pupil — vertical slit (cat!) -->
      <ellipse rx="3" ry="8" fill="#00e5c8" opacity="0.9" filter="url(#glow4)"/>
      <!-- Highlight -->
      <circle cx="4" cy="-4" r="2.5" fill="white" opacity="0.5"/>
      <!-- Network node dots on eye ring -->
      <circle cx="13"  cy="0"  r="2" fill="#00e5c8" filter="url(#glow4)"/>
      <circle cx="-13" cy="0"  r="2" fill="#00e5c8" filter="url(#glow4)"/>
      <circle cx="0"   cy="-13" r="2" fill="#ffaa00" filter="url(#glow4)"/>
    </g>

    <!-- ── RIGHT EYE — EtherCAT ring node ── -->
    <g transform="translate(32,-12)">
      <circle r="20" fill="#060e18" stroke="#00e5c8" stroke-width="1.5"/>
      <circle r="13" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
      <ellipse rx="9" ry="11" fill="#001a2e"/>
      <ellipse rx="9" ry="11" fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.6"/>
      <ellipse rx="3" ry="8" fill="#00e5c8" opacity="0.9" filter="url(#glow4)"/>
      <circle cx="4" cy="-4" r="2.5" fill="white" opacity="0.5"/>
      <circle cx="13"  cy="0"   r="2" fill="#00e5c8" filter="url(#glow4)"/>
      <circle cx="-13" cy="0"   r="2" fill="#00e5c8" filter="url(#glow4)"/>
      <circle cx="0"   cy="-13" r="2" fill="#ffaa00" filter="url(#glow4)"/>
    </g>

    <!-- ── NOSE — diamond data-node ── -->
    <polygon points="0,-2 -6,6 0,12 6,6"
             fill="#ffaa00" opacity="0.85" filter="url(#glow4)"/>
    <polygon points="0,-2 -6,6 0,12 6,6"
             fill="none" stroke="#ffaa00" stroke-width="0.5"/>

    <!-- ── WHISKERS — EtherCAT bus lines ── -->
    <g stroke="#00e5c8" stroke-width="0.75" opacity="0.55">
      <!-- Left whiskers -->
      <line x1="-20" y1="10" x2="-82" y2="2"/>
      <line x1="-20" y1="14" x2="-82" y2="18"/>
      <line x1="-20" y1="18" x2="-75" y2="32"/>
      <!-- Right whiskers -->
      <line x1="20" y1="10" x2="82" y2="2"/>
      <line x1="20" y1="14" x2="82" y2="18"/>
      <line x1="20" y1="18" x2="75" y2="32"/>
    </g>
    <!-- Whisker end nodes -->
    <g filter="url(#glow2)" opacity="0.7">
      <circle cx="-82" cy="2"  r="2" fill="#00e5c8"/>
      <circle cx="-82" cy="18" r="2" fill="#00e5c8"/>
      <circle cx="-75" cy="32" r="2" fill="#0088ff"/>
      <circle cx="82"  cy="2"  r="2" fill="#00e5c8"/>
      <circle cx="82"  cy="18" r="2" fill="#00e5c8"/>
      <circle cx="75"  cy="32" r="2" fill="#0088ff"/>
    </g>

    <!-- ── MOUTH — curved with node points ── -->
    <path d="M -14,22 Q -7,32 0,26 Q 7,32 14,22"
          fill="none" stroke="#00e5c8" stroke-width="1.2" opacity="0.6"/>
    <circle cx="-14" cy="22" r="2" fill="#00e5c8" opacity="0.5"/>
    <circle cx="14"  cy="22" r="2" fill="#00e5c8" opacity="0.5"/>

    <!-- ── Forehead EtherCAT ring mark ── -->
    <g transform="translate(0,-55)" opacity="0.5">
      <circle r="8" fill="none" stroke="#00e5c8" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="8"  cy="0" r="1.5" fill="#00e5c8"/>
      <circle cx="-8" cy="0" r="1.5" fill="#00e5c8"/>
      <circle cx="0" cy="-8" r="1.5" fill="#ffaa00"/>
      <circle cx="0" cy="8"  r="1.5" fill="#ffaa00"/>
      <line x1="0" y1="-8" x2="0" y2="-18" stroke="#00e5c8" stroke-width="0.75"/>
    </g>

  </g>
  <!-- end cat logo -->

  <!-- ══════════════════════════════
       LOGOTYPE
  ══════════════════════════════ -->
  <text x="400" y="372" text-anchor="middle"
        font-family="Orbitron, monospace" font-weight="900" font-size="38"
        fill="url(#textGrad)" filter="url(#glow2)" letter-spacing="6">
    DAC-ECAT
  </text>

  <!-- Subtitle -->
  <text x="400" y="395" text-anchor="middle"
        font-family="DM Mono, monospace" font-size="10" fill="#2a4a60"
        letter-spacing="5">
    DISTRIBUTED AUTOMATION CONTROL
  </text>

  <!-- Version / tagline row -->
  <g transform="translate(400,426)">
    <line x1="-110" y1="0" x2="-18" y2="0" stroke="#1a3040" stroke-width="0.75"/>
    <text x="0" y="4" text-anchor="middle" font-family="DM Mono, monospace"
          font-size="8" fill="#00e5c8" letter-spacing="3">ECAT</text>
    <line x1="18" y1="0" x2="110" y2="0" stroke="#1a3040" stroke-width="0.75"/>
  </g>

  <!-- Corner marks -->
  <g stroke="#1a3040" stroke-width="1">
    <path d="M 20,20 L 20,44 M 20,20 L 44,20" fill="none" stroke="#00e5c8" opacity="0.4"/>
    <path d="M 780,20 L 780,44 M 780,20 L 756,20" fill="none" stroke="#00e5c8" opacity="0.4"/>
    <path d="M 20,480 L 20,456 M 20,480 L 44,480" fill="none" stroke="#00e5c8" opacity="0.4"/>
    <path d="M 780,480 L 780,456 M 780,480 L 756,480" fill="none" stroke="#00e5c8" opacity="0.4"/>
  </g>

  <!-- Build info -->
  <text x="28" y="488" font-family="DM Mono, monospace" font-size="7" fill="#1a3040" letter-spacing="2">v1.0.0</text>
  <text x="772" y="488" text-anchor="end" font-family="DM Mono, monospace" font-size="7" fill="#1a3040" letter-spacing="2">DAC-ECAT SYSTEM</text>
</svg>
