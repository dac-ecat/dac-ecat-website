<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110">
      <defs>
        <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00e5c8"/>
          <stop offset="100%" stop-color="#ffaa00"/>
        </linearGradient>
        <filter id="sglow"><feGaussianBlur stdDeviation="2" result="b"/>
