<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <style>
          .spin1 { transform-origin: 60px 60px; animation: spin 3s linear infinite; }
          .spin2 { transform-origin: 60px 60px; animation: spin 2s linear infinite reverse; }
          .pulse { animation: pulse 1.5s ease-in-out infinite; }
          .blink { animation: blink 0.9s ease-in-out infinite; }
          @keyframes spin  { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
          @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.15;} }
        </style>
        <filter id="lGlow"><feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- Outer spinning ring dashes -->
      <circle cx="60" cy="60" r="52" fill="none" stroke="#00e5c8" stroke-width="1.5"
              stroke-dasharray="8,6" opacity="0.5" class="spin1"/>
      <!-- Inner counter-spinning ring -->
      <circle cx="60" cy="60" r="42" fill="none" stroke="#0066cc" stroke-width="1"
              stroke-dasharray="5,8" opacity="0.4" class="spin2"/>
      <!-- Spinning nodes on outer ring -->
      <g class="spin1" filter="url(#lGlow)">
        <circle cx="60"  cy="8"  r="4" fill="#00e5c8"/>
        <circle cx="112" cy="60" r="4" fill="#00e5c8"/>
        <circle cx="60"  cy="112" r="4" fill="#ffaa00"/>
        <circle cx="8"   cy="60" r="4" fill="#00e5c8"/>
      </g>
      <!-- Static cat face center -->
      <ellipse cx="60" cy="62" rx="24" ry="22" fill="#040c18" stroke="#0d2030" stroke-width="1"/>
      <!-- Ears -->
      <polygon points="44,44 38,28 52,40" fill="#040c18" stroke="#00e5c8" stroke-width="1.5"/>
      <polygon points="76,44 82,28 68,40" fill="#040c18" stroke="#00e5c8" stroke-width="1.5"/>
      <!-- Eyes blinking -->
      <g class="pulse">
        <circle cx="51" cy="58" r="7" fill="#040c18" stroke="#00e5c8" stroke-width="1.2"/>
        <ellipse cx="51" cy="58" rx="2" ry="5" fill="#00e5c8" opacity="0.9" filter="url(#lGlow)"/>
        <circle cx="69" cy="58" r="7" fill="#040c18" stroke="#00e5c8" stroke-width="1.2"/>
        <ellipse cx="69" cy="58" rx="2" ry="5" fill="#00e5c8" opacity="0.9" filter="url(#lGlow)"/>
      </g>
      <!-- Nose -->
      <polygon points="60,67 57,72 60,76 63,72" fill="#ffaa00" opacity="0.9" filter="url(#lGlow)" class="blink"/>
    </svg>
